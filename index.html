<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cálculo de Frete Automatizado</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .checkout-container { max-width: 400px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .result { margin-top: 15px; font-size: 1.1em; }
    </style>
</head>
<body>

<div class="checkout-container">
    <h3>Resumo do Pedido</h3>
    <p>Subtotal: <span id="subtotal">R$ 100,00</span></p>
    
    <div class="form-group">
        <label for="cepInput">Digite seu CEP:</label>
        <!-- Máscara simples e limite de caracteres para o CEP brasileiro -->
        <input type="text" id="cepInput" placeholder="00000-000" maxlength="9">
    </div>
    
    <button onclick="processarFrete()">Calcular Frete</button>

    <div class="result">
        <p>Frete: <span id="valorFrete">R$ 0,00</span></p>
        <p><strong>Total: <span id="valorTotal">R$ 100,00</span></strong></p>
    </div>
</div>

<script>
// Valor base do produto fictício
const subtotal = 100.00;

// Exemplo 1: Lógica local baseada nos primeiros dígitos do CEP
function calcularFretePorRegiao(cep) {
    // Remove hífen ou espaços para validação limpa
    const cepLimpo = cep.replace(/\D/g, ''); 
    
    if (cepLimpo.length !== 8) {
        alert("Por favor, insira um CEP válido com 8 dígitos.");
        return null;
    }

    // Pega os dois primeiros dígitos para determinar a região (Exemplo para o Brasil)
    const prefixo = parseInt(cepLimpo.substring(0, 2));

    if (prefixo >= 1 && prefixo <= 19) {
        return 15.00; // São Paulo (Capital e Interior)
    } else if (prefixo >= 20 && prefixo <= 28) {
        return 22.00; // Rio de Janeiro e Espírito Santo
    } else if (prefixo >= 30 && prefixo <= 39) {
        return 25.00; // Minas Gerais
    } else {
        return 35.00; // Demais regiões
    }
}

// Função principal que atualiza a tela
function processarFrete() {
    const cepValue = document.getElementById('cepInput').value;
    const taxaFrete = calcularFretePorRegiao(cepValue);

    if (taxaFrete !== null) {
        const totalGeral = subtotal + taxaFrete;

        // Atualiza os valores na interface formatados em Real (R$)
        document.getElementById('valorFrete').innerText = taxaFrete.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('valorTotal').innerText = totalGeral.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }
}

// Bônus: Formata o CEP automaticamente com hífen enquanto o usuário digita (XXXXX-XXX)
document.getElementById('cepInput').addEventListener('input', function (e) {
    let value = e.target.value.replace(/\D/g, '');
    if (value.length > 5) {
        value = value.substring(0, 5) + '-' + value.substring(5, 8);
    }
    e.target.value = value;
});
</script>

</body>
</html>
